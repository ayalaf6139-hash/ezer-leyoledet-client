# הגדרות פריסה ל-Render (Blueprint) – אתר ה-React כאתר סטטי.
services:
  - type: web
    name: ezer-leyoledet-client
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    # כל כתובת באתר מחזירה את index.html, כדי ש-React Router יטפל בה (בלי 404 ברענון)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # כתובת השרת (בלי /api בסוף – הקוד מוסיף אותו)
      - key: VITE_API_URL
        value: https://ezer-leyoledet-api.onrender.com
